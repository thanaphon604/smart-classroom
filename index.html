/* ---------------- ⚙️ ตั้งค่าระบบ ---------------- */
function dbStatusTag(status) {
  const m = { READY: ['ok', 'พร้อมใช้งาน'], OUTDATED: ['late', 'ต้องอัปเดตโครงสร้าง'], EMPTY: ['', 'ชีตว่าง ยังไม่มีตาราง'], NEWER: ['red', 'เวอร์ชันใหม่กว่าโปรแกรม'] };
  const x = m[status] || ['', status];
  return `<span class="tag ${x[0]}">${esc(x[1])}</span>`;
}
/** หลังเปลี่ยนฐานข้อมูล: แจ้งผล แล้วเริ่มระบบใหม่ (ส่วนใหญ่ต้องเข้าสู่ระบบใหม่) */
function dbSwitched(r) {
  let started = false;
  const restart = () => { if (started) return; started = true; Store.del('ctx'); Store.set('next', { page: 'settings', p: { section: 'database' } }); if (r.relogin) App.logoutLocal(); App.start(); };
  const m = modal({
    title: 'เปลี่ยนฐานข้อมูลแล้ว',
    body: `<p style="margin:0 0 8px">ตอนนี้ระบบใช้ <b>${esc(r.current.name)}</b> เป็นฐานข้อมูล</p>
      ${r.admin_created ? `<p style="margin:0 0 8px">สร้างผู้ดูแลเริ่มต้นให้แล้ว: <b class="mono">${esc(r.admin_created.username)}</b> / <b class="mono">${esc(r.admin_created.password)}</b> — เข้าระบบแล้วเปลี่ยนรหัสผ่านที่ "บัญชีของฉัน"</p>` : ''}
      ${r.relogin ? '<p class="note" style="margin:0">กรุณาเข้าสู่ระบบใหม่ด้วยบัญชีของฐานข้อมูลนี้</p>' : ''}`,
    actions: [{ label: r.relogin ? 'ไปหน้าเข้าสู่ระบบ' : 'ตกลง', kind: 'primary', onClick: restart }]
  });
  // ปิดด้วย Esc/คลิกนอกกล่อง ก็ต้องเริ่มใหม่เหมือนกัน
  const obs = new MutationObserver(() => { if (!m.root.isConnected) { obs.disconnect(); restart(); } });
  obs.observe($('#modal'), { childList: true });
}
function copyText(text) {
  const done = () => toast('คัดลอกแล้ว');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => fallback());
  } else fallback();
  function fallback() {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('คัดลอกไม่ได้ — เลือกข้อความแล้วกด Ctrl+C', true); }
    ta.remove();
  }
}

  input(t, d, c, row) {

    if (c.type === 'bool') return `<label><input type="checkbox" name="${c.name}" ${v ? 'checked' : ''} ${dis}> ${esc(c.label)}</label>`;
    let ctl;
    if (c.ref) {
      ctl = `<select name="${c.name}" ${dis}><option value="">${c.required ? '— เลือก —' : '(ไม่ระบุ)'}</option>${(d.options[c.name] || []).map(o =>

      const blank = !c.required ? '<option value="">(ไม่ระบุ)</option>' : (v === null || v === undefined || v === '') ? '<option value="" selected>— เลือก —</option>' : '';

        `<option ${String(x) === String(v) ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>`;

    $('form', m.root).onsubmit = e => e.preventDefault();
  },

  /* ---------- ฐานข้อมูล: ใช้ชีตไหน / ขนาด / เครื่องมือ / เปลี่ยนที่เก็บข้อมูล ---------- */
  async database(el, tabs) {
    const d = await call('database.info');
    const s = d.scan;
    const n = v => Number(v || 0).toLocaleString('en-US');
    const pctOf = (a, b) => Math.min(100, b ? a / b * 100 : 0);
    const pctTxt = p => (p > 0 && p < 1 ? p.toFixed(1) : String(Math.round(p))) + '%';
    const level = p => (p >= 90 ? 'bad' : p >= 70 ? 'warn' : '');
    const cellPct = pctOf(s.cells, s.cell_limit), rowPct = pctOf(s.biggest.rows, d.suggest_rows);
    const tbl = name => s.tables.find(t => t.name === name) || { rows: 0, label: name };
    const students = tbl('students').rows;
    const GROUPS = { system: 'ระบบ', master: 'ข้อมูลหลัก', people: 'บุคคล', gradebook: 'งาน/คะแนน', attendance: 'เวลาเรียน', lookup: 'ตารางอ้างอิง' };
    const tool = (key, ico, title, text, btn, opt) => `<div class="tool ${opt && opt.danger ? 'danger' : ''}"><h4>${ico} ${esc(title)}</h4><p>${text}</p>
      <button class="btn ${opt && opt.kind ? opt.kind : ''}" data-tool="${key}" ${opt && opt.disabled ? 'disabled' : ''}>${esc(btn)}</button></div>`;
    el.innerHTML = `${tabs}
      <section class="db-hero ${d.is_home ? '' : 'away'}" aria-label="ฐานข้อมูลที่ใช้อยู่">
        <div class="db-head"><span class="ico" aria-hidden="true">🗄️</span><h2>${esc(d.current.name)}</h2>${dbStatusTag(s.status)}
          <span class="grow"></span><a class="btn small" href="${esc(d.current.url)}" target="_blank" rel="noopener">เปิดชีต ↗</a></div>
        <dl class="db-meta">
          <div><dt>ชนิดฐานข้อมูล</dt><dd>${esc(d.kind)} <span class="muted">• 1 แท็บ = 1 ตาราง</span></dd></div>
          <div><dt>ที่มา</dt><dd>${d.is_home ? 'ชีตหลัก (ชีตที่ผูกกับโค้ด)' : 'ชีตอื่นที่ตั้งไว้ในหน้านี้'}</dd></div>
          <div><dt>โครงสร้างข้อมูล</dt><dd>เวอร์ชัน ${esc(s.version || '-')}${String(s.version) !== String(s.expected_version) ? ` <span class="redpen">(โปรแกรมใช้ ${s.expected_version})</span>` : ''} • ${s.tables_found}/${s.tables_total} ตาราง</dd></div>
          <div><dt>Spreadsheet ID</dt><dd class="mono">${esc(d.current.id)}<button class="copy" data-copy="${esc(d.current.id)}">คัดลอก</button></dd></div>
          ${d.web_app_url ? `<div><dt>ลิงก์เว็บแอป (แจกครู/นักเรียน)</dt><dd class="mono">${esc(d.web_app_url)}<button class="copy" data-copy="${esc(d.web_app_url)}">คัดลอก</button></dd></div>` : ''}
        </dl>
        <div class="db-cap">
          <div><div class="lbl"><span>พื้นที่ไฟล์ (Google จำกัด 10 ล้านเซลล์)</span><b>${pctTxt(cellPct)}</b></div>
            <div class="meter ${level(cellPct)}"><i style="width:${cellPct}%"></i></div>
            <p class="note" style="margin:6px 0 0">ใช้ ${n(s.cells)} เซลล์ • ข้อมูลรวม ${n(s.rows_total)} แถว</p></div>
          <div><div class="lbl"><span>ตารางใหญ่สุด: ${esc(tbl(s.biggest.name).label)}</span><b>${n(s.biggest.rows)} / ${n(d.suggest_rows)} แถว</b></div>
            <div class="meter ${level(rowPct)}"><i style="width:${rowPct}%"></i></div>
            <p class="note" style="margin:6px 0 0">ถ้าเกิน ${n(d.suggest_rows)} แถว หน้าเว็บจะเริ่มช้า — ถึงเวลาย้ายไป SQL Server</p></div>
        </div>
        ${d.is_home ? '' : `<div class="db-away"><span>ตอนนี้ไม่ได้ใช้ชีตหลัก${d.home ? ' ("' + esc(d.home.name) + '")' : ''}</span><button class="btn small" data-act="home">กลับไปใช้ชีตหลัก</button></div>`}
      </section>

      <div class="section"><h2>ตาราง <small class="muted">${s.tables_total} ตาราง • ${n(s.rows_total)} แถว</small></h2>
        <div class="tbl-wrap"><table class="t db-tables"><thead><tr><th>ตาราง (ชื่อแท็บ)</th><th>เก็บอะไร</th><th class="grp">กลุ่ม</th><th class="n">แถว</th><th>โครงสร้าง</th></tr></thead><tbody>
        ${s.tables.map(t => `<tr><td class="mono">${esc(t.name)}</td><td>${esc(t.label)}</td><td class="muted grp">${esc(GROUPS[t.group] || t.group)}</td><td class="n">${n(t.rows)}</td>
          <td>${!t.exists ? '<span class="tag red">ไม่มีแท็บนี้</span>' : t.missing.length ? `<span class="tag late" title="${esc(t.missing.join(', '))}">ขาด ${t.missing.length} คอลัมน์</span>` : '<span class="tag ok">ครบ</span>'}</td></tr>`).join('')}
        </tbody></table></div>
        ${s.other_sheets.length ? `<p class="note">แท็บอื่นในไฟล์ที่ระบบไม่ได้ใช้: ${esc(s.other_sheets.join(', '))}</p>` : ''}
      </div>

      <div class="section"><h2>เครื่องมือ</h2><div class="tool-grid">
        ${tool('validate', '🔍', 'ตรวจความถูกต้องของข้อมูล', 'ตรวจทุกตารางแบบฐานข้อมูลจริง: รหัสซ้ำ ช่องบังคับว่าง ชนิดข้อมูล และการอ้างอิงข้ามตาราง — ใช้หลังแก้ข้อมูลในชีตด้วยมือ', 'ตรวจเลย')}
        ${tool('setup', '🛠️', 'อัปเดตโครงสร้างตาราง', 'สร้างแท็บ/คอลัมน์ที่ขาด และใส่ค่าตั้งต้น ไม่ลบข้อมูลเดิม — ใช้หลังอัปเดตโปรแกรม', 'อัปเดต', { kind: s.status === 'READY' ? '' : 'primary' })}
        ${tool('backup', '💾', 'สำรองข้อมูล', 'ทำสำเนาไฟล์ชีตทั้งไฟล์ไว้ใน Google Drive — แนะนำก่อนล้างข้อมูล หรือก่อนขึ้นภาคเรียนใหม่', 'สำรองตอนนี้')}
        ${tool('export', '📤', 'ส่งออก CSV', 'ไฟล์ CSV 1 ไฟล์ต่อตาราง ไว้ใน Google Drive สำหรับนำเข้า SQL Server ด้วย <span class="mono">003_import_csv.sql</span>', 'ส่งออก')}
        ${tool('seed', '🧪', 'ใส่ข้อมูลตัวอย่าง', 'ชุดเดียวกับชีตตัวอย่าง: ห้อง 3/1–3/10 นักเรียน 302 คน งาน 40 ชิ้น' + (students ? ' — <b>ใช้ได้เมื่อยังไม่มีนักเรียน</b>' : ''), 'ใส่ข้อมูลตัวอย่าง', { disabled: students > 0 })}
        ${tool('clear', '🗑️', 'ล้างข้อมูลทั้งหมด', 'ลบนักเรียน ห้อง วิชา งาน คะแนน เช็กชื่อ และผู้ใช้ที่ไม่ใช่ผู้ดูแล เก็บการตั้งค่าและเกณฑ์ไว้ — ย้อนกลับไม่ได้', 'ล้างข้อมูล…', { danger: true, kind: 'danger' })}
      </div></div>

      <div class="section"><h2>เปลี่ยนที่เก็บข้อมูล</h2>
        <div class="switch">
          <div><h4>ใช้ Google Sheet อื่นเป็นฐานข้อมูล</h4>
            <p class="note" style="margin:0">วางลิงก์ชีตแล้วกดตรวจสอบ — บัญชี Google ที่ติดตั้งระบบต้องมีสิทธิ์ "แก้ไข" ชีตนั้น</p>
            <form class="row" data-inspect><label class="f"><span>ลิงก์ Google Sheet หรือ ID</span><input type="text" name="ref" placeholder="https://docs.google.com/spreadsheets/d/…" required autocomplete="off"></label>
              <button class="btn" type="submit">ตรวจสอบ</button></form>
            <div data-result></div></div>
          <div><h4>สร้าง Google Sheet ใหม่เป็นฐานข้อมูล</h4>
            <p class="note" style="margin:0">สร้างไฟล์ใหม่ใน Google Drive พร้อมตารางครบแต่ยังไม่มีข้อมูล เหมาะกับเริ่มปีการศึกษาใหม่ — ชีตเดิมยังอยู่ กลับมาใช้ได้</p>
            <form class="row" data-create><label class="f"><span>ชื่อไฟล์</span><input type="text" name="name" maxlength="100" placeholder="เช่น Smart Classroom DB 2570"></label>
              <button class="btn" type="submit">สร้างแล้วใช้</button></form></div>
        </div>
        <p class="note">เปลี่ยนแล้วทุกคนต้องเข้าสู่ระบบใหม่ด้วยบัญชีในฐานข้อมูลนั้น และข้อมูลจะไม่ย้ายตามไป — ถ้าต้องการยกข้อมูลไปด้วย ให้กด "สำรองข้อมูล" แล้วใช้ไฟล์สำรองนั้นเป็นฐานข้อมูล</p>
      </div>`;

    const again = () => go('settings', { section: 'database' });
    const busy = async (btn, fn) => { btn.disabled = true; const t = btn.textContent; btn.textContent = 'กำลังทำงาน…'; try { await fn(); } catch (e) { showError(e); } finally { btn.disabled = false; btn.textContent = t; } };
    $$('[data-copy]', el).forEach(b => b.onclick = () => copyText(b.dataset.copy));
    const homeBtn = $('[data-act=home]', el);
    if (homeBtn) homeBtn.onclick = async () => {
      if (!await confirmBox('กลับไปใช้ชีตหลัก', 'เปลี่ยนฐานข้อมูลกลับไปเป็น "' + (d.home ? d.home.name : 'ชีตหลัก') + '" ทุกคนต้องเข้าสู่ระบบใหม่', 'เปลี่ยน')) return;
      busy(homeBtn, async () => dbSwitched(await call('database.useHome')));
    };
    const tools = {
      validate: async () => {
        const r = await call('database.validate');
        modal({ title: r.count ? 'พบปัญหา ' + n(r.count) + ' จุด' : 'ตรวจความถูกต้องแล้ว',
          body: r.count ? `<ul class="problems">${r.problems.map(x => `<li>${esc(x)}</li>`).join('')}</ul>${r.count > r.problems.length ? `<p class="note">แสดง ${r.problems.length} จุดแรก</p>` : ''}`
            : '<p style="margin:0">✅ ข้อมูลถูกต้องครบทุกตาราง (รหัส ช่องบังคับ ชนิดข้อมูล การอ้างอิง) — ส่งออกไป SQL Server ได้</p>' });
      },
      setup: async () => { const r = await call('database.setup'); toast('อัปเดตโครงสร้างแล้ว ' + r.tables + ' ตาราง'); again(); },
      backup: async () => {
        const r = await call('database.backup');
        modal({ title: 'สำรองข้อมูลแล้ว', body: `<p style="margin:0 0 8px">สร้างไฟล์ <b>${esc(r.name)}</b> ใน Google Drive แล้ว</p>
          <p class="note" style="margin:0">ถ้าต้องการใช้ไฟล์นี้เป็นฐานข้อมูล ให้คัดลอกลิงก์ไปวางที่ "ใช้ Google Sheet อื่นเป็นฐานข้อมูล"</p>
          <p style="margin:12px 0 0"><a class="btn small" href="${esc(r.url)}" target="_blank" rel="noopener">เปิดไฟล์สำรอง ↗</a> <button class="btn small" data-c>คัดลอกลิงก์</button></p>` }).root.querySelector('[data-c]').onclick = () => copyText(r.url);
      },
      export: async () => {
        const r = await call('database.exportCsv');
        modal({ title: 'ส่งออก CSV แล้ว', body: `<p style="margin:0 0 8px">${r.files} ไฟล์ ในโฟลเดอร์ <b>${esc(r.folder_name)}</b> (Google Drive)</p>
          <p class="note" style="margin:0">ดาวน์โหลดโฟลเดอร์ไปไว้ที่ C:\\import\\ แล้วรัน database/sqlserver/003_import_csv.sql</p>
          <p style="margin:12px 0 0"><a class="btn small" href="${esc(r.url)}" target="_blank" rel="noopener">เปิดโฟลเดอร์ ↗</a></p>` });
      },
      seed: async () => {
        if (!await confirmBox('ใส่ข้อมูลตัวอย่าง', 'สร้างห้อง 3/1–3/10 นักเรียน 302 คน งาน 40 ชิ้น คะแนน และเช็กชื่อ พร้อมบัญชี teacher1 / teacher1234', 'ใส่ข้อมูล')) return;
        const r = await call('database.seedDemo');
        await App.reloadBoot(); App.renderShell();
        toast('ใส่ข้อมูลตัวอย่างแล้ว: นักเรียน ' + r.students + ' คน'); again();
      },
      clear: async () => {
        modal({ title: 'ล้างข้อมูลทั้งหมด', body: `<p style="margin:0 0 10px">ฐานข้อมูล <b>${esc(d.current.name)}</b>: ลบนักเรียน ${n(students)} คน ห้อง วิชา งาน คะแนน เช็กชื่อ และผู้ใช้ที่ไม่ใช่ผู้ดูแล <b class="redpen">ย้อนกลับไม่ได้</b></p>
            <p class="note" style="margin:0 0 10px">แนะนำให้กด "สำรองข้อมูล" ก่อน</p>
            <label class="f"><span>พิมพ์คำว่า ลบ เพื่อยืนยัน</span><input type="text" name="confirm" autocomplete="off"></label>`,
          actions: [{ label: 'ยกเลิก' }, { label: 'ล้างข้อมูล', kind: 'danger', onClick: async (close, root) => {
            await call('database.clear', { confirm: $('[name=confirm]', root).value });
            Store.del('ctx'); await App.reloadBoot(); App.renderShell();
            toast('ล้างข้อมูลแล้ว'); again();
          } }] });
      }
    };
    $$('[data-tool]', el).forEach(b => b.onclick = () => busy(b, tools[b.dataset.tool]));

    const result = $('[data-result]', el);
    $('[data-inspect]', el).onsubmit = async e => {
      e.preventDefault();
      const btn = $('button', e.target);
      busy(btn, async () => {
        const r = await call('database.inspect', { id: formData(e.target).ref });
        const t = r.scan;
        const ready = t.status === 'READY';
        const can = !r.is_current && t.status !== 'NEWER';
        const tr = name => (t.tables.find(x => x.name === name) || { rows: 0 }).rows;
        result.innerHTML = `<div class="inspect">
          <div class="t1">${esc(r.name)} ${dbStatusTag(t.status)}</div>
          <div class="note">${t.tables_found}/${t.tables_total} ตาราง${t.tables_found ? ` • นักเรียน ${n(tr('students'))} คน • ผู้ใช้ ${n(tr('users'))} บัญชี • ข้อมูล ${n(t.rows_total)} แถว` : ''}${t.other_sheets.length ? ` • แท็บอื่น: ${esc(t.other_sheets.slice(0, 5).join(', '))}` : ''}</div>
          ${r.is_current ? '<div class="note">ชีตนี้คือฐานข้อมูลที่ใช้อยู่แล้ว</div>' : ''}
          ${t.status === 'NEWER' ? '<div class="redpen">ชีตนี้ใช้โครงสร้างเวอร์ชันใหม่กว่าโปรแกรม — อัปเดตโค้ดก่อน</div>' : ''}
          ${can ? `<div><button class="btn primary" data-use>${ready ? 'ใช้ชีตนี้เป็นฐานข้อมูล' : 'สร้างตารางในชีตนี้แล้วใช้'}</button>
            ${!ready && t.tables_found ? '<span class="note"> จะเพิ่มแท็บ/คอลัมน์ที่ขาด ไม่ลบข้อมูลเดิม</span>' : ''}</div>` : ''}
        </div>`;
        const ub = $('[data-use]', result);
        if (ub) ub.onclick = async () => {
          if (!await confirmBox('เปลี่ยนฐานข้อมูล', 'ใช้ "' + r.name + '" เป็นฐานข้อมูลแทน "' + d.current.name + '" — ทุกคน (รวมคุณ) ต้องเข้าสู่ระบบใหม่ด้วยบัญชีในฐานข้อมูลนั้น ชีตเดิมยังอยู่ กลับมาใช้ได้', 'เปลี่ยนฐานข้อมูล')) return;
          busy(ub, async () => dbSwitched(await call('database.use', { id: r.id, setup: !ready })));
        };
      });
    };
    $('[data-create]', el).onsubmit = async e => {
      e.preventDefault();
      const name = formData(e.target).name;
      if (!await confirmBox('สร้างฐานข้อมูลใหม่', 'สร้าง Google Sheet ใหม่' + (name ? ' "' + name + '"' : '') + ' แล้วใช้เป็นฐานข้อมูลทันที (ยังไม่มีข้อมูล) — ทุกคนต้องเข้าสู่ระบบใหม่', 'สร้างแล้วใช้')) return;
      busy($('button', e.target), async () => dbSwitched(await call('database.create', { name })));
    };
  },

  async audit(el, tabs) {
    const logs = await call('admin.auditLogs', { limit: 200 });
    el.innerHTML = `${tabs}<p class="note">200 รายการล่าสุด</p>
      <div class="tbl-wrap"><table class="t"><thead><tr><th>เวลา</th><th>ผู้ใช้</th><th>การกระทำ</th><th>ตาราง</th><th>รหัส</th><th>รายละเอียด</th></tr></thead><tbody>
      ${logs.map(l => `<tr><td style="white-space:nowrap">${thDateTime(l.logged_at)}</td><td>${esc(l.user_name || '-')}</td><td>${esc(l.action)}</td><td class="muted">${esc(l.table_name || '')}</td><td class="muted">${esc(l.record_id || '')}</td><td class="muted">${esc(l.detail || '')}</td></tr>`).join('')}
      </tbody></table></div>`;
  }
};
</script>

  <script>App.start();</script>
</body>
</html>
